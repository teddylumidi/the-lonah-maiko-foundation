# Pages CMS configuration — https://app.pagescms.org
# Lets the foundation team edit selected content without touching code.
media:
  input: Images/uploads
  output: /Images/uploads

content:
  - name: appeal
    label: December Girls' Appeal
    type: file
    path: data/appeal.json
    format: json
    fields:
      - name: raised
        label: Amount raised so far (KSh, numbers only)
        type: number
      - name: goal
        label: Appeal goal (KSh)
        type: number
      - name: per_girl
        label: Cost per girl (KSh)
        type: number
      - name: mpesa_number
        label: M-Pesa number (e.g. 0705834784)
        type: string
      - name: mpesa_name
        label: Name M-Pesa shows (capitals)
        type: string

  - name: news
    label: News stories
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date (e.g. 3 December 2026)
        type: string
      - name: place
        label: Place (optional)
        type: string
      - name: image
        label: Main photo
        type: image
      - name: summary
        label: Short summary (1–2 sentences)
        type: text
      - name: body
        label: Full story
        type: rich-text

  - name: menu
    label: Menus
    type: file
    path: data/menu.json
    format: json
    fields:
      - name: header
        label: Top menu (in order)
        type: object
        list: true
        fields:
          - name: label
            label: Text
            type: string
            required: true
          - name: url
            label: Link (e.g. health.html or https://...)
            type: string
            required: true
          - name: button
            label: Show as highlighted button (like DONATE)
            type: boolean
      - name: footer
        label: Footer links (in order)
        type: object
        list: true
        fields:
          - name: label
            label: Text
            type: string
            required: true
          - name: url
            label: Link
            type: string
            required: true

  - name: images
    label: Site images
    type: file
    path: data/images.json
    format: json
    fields:
      - name: site
        label: Whole site
        type: object
        fields:
          - name: logo
            label: Logo (header on every page)
            type: image
      - name: donate
        label: "Donate page (donate.html)"
        type: object
        fields:
          - name: img01
            label: "M-Pesa"
            type: image
          - name: img02
            label: "Co-operative Bank of Kenya"
            type: image
      - name: education
        label: "Education page (education.html)"
        type: object
        fields:
          - name: img01
            label: "Education Programs"
            type: image
          - name: img02
            label: "Student Sponsorship"
            type: image
